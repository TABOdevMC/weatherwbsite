<!doctype html>
<html lang="fr">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#0b1220"><title>WeatherWB — Météo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body><div class="background-glow glow-one"></div><div class="background-glow glow-two"></div><main id="app">
<header class="topbar"><div class="brand"><span class="brand-icon">☀</span><div><strong>WeatherWB</strong><small>La météo, simplement.</small></div></div><div class="actions"><form id="searchForm" class="search"><span>⌕</span><input id="searchInput" placeholder="Rechercher une ville..." autocomplete="off"><button type="submit">Rechercher</button></form><button id="locationBtn" class="location-btn" type="button">⌖ <span>Ma position</span></button></div></header>
<div id="suggestions"></div><p id="status" class="status">Chargement...</p>
<section id="weather" hidden><div class="hero-card"><div class="hero-main"><div class="eyebrow"><span class="live-dot"></span> CONDITIONS ACTUELLES</div><p id="place" class="place"></p><h1 id="temperature"></h1><p id="description" class="description"></p></div><div class="hero-details"><div><span>Ressenti</span><b id="feels"></b></div><div><span>Max / Min</span><b id="maxmin"></b></div></div></div>
<div class="stats"><article><span class="stat-icon">💧</span><div><small>Humidité</small><b id="humidity"></b></div></article><article><span class="stat-icon">💨</span><div><small>Vent</small><b id="wind"></b></div></article><article><span class="stat-icon">☔</span><div><small>Pluie</small><b id="rain"></b></div></article><article><span class="stat-icon">☀️</span><div><small>Indice UV</small><b id="uv"></b></div></article></div>
<section class="panel"><div class="panel-title"><div><span>PROCHAINES HEURES</span><h2>Prévisions horaires</h2></div><small>24 heures</small></div><div id="hourly" class="forecast-scroll"></div></section>
<section class="panel"><div class="panel-title"><div><span>TENDANCE</span><h2>Les 7 prochains jours</h2></div><small>Prévisions</small></div><div id="daily" class="daily-grid"></div></section></section></main><footer>Données météo fournies par <strong>Open-Meteo</strong> · Prévisions en temps réel</footer><script src="app.js"></script></body></html>
